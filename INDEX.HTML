<!DOCTYPE html>
<html lang="pt-BR" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.1">
    <title>Cadastre-se</title>
</head>    
  
<body>
   <h1>Cadastre-se</h1>
   <h4>Preencha os espaços em branco a seguir:</h4>

  <form class="formulario">
    
    <fieldset>
        <legend>Informações Pessoais</legend>
      
        <!--NOME-->
      <div class="campo">
         <label for="nome">Nome Completo:</label>
         <input type="text" id="nome" name="nome" required>
      </div>
      
        <!--CPF-->
      <div class="campo">
         <label for="cpf">CPF:</label>
         <input type="text" id ="cpf" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" 
         placeholder="000.000.000-00" title="Formato: 000.000.000-00">
      </div>
      
        <!-- Telefone Celular -->
      <div class="campo">
         <label for="tel">Telefone:</label>
         <input type="tel" id="tel" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" 
         placeholder="(00) 00000-0000" title="Formato: (00) 00000-0000">
      </div>
      
        <!--Data de Nascimento-->
      <div class="campo">
         <label for="nascimento">Data de Nascimento:</label>
         <input type="date" id="nascimento" name="nascimento" required>
      </div>
      
           <!--Email-->
      <div class="campo">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>
      </div>
      
              <!--Senha-->
      <div class="campo">
         <label for="senha">Senha:</label>
         <input type="password" id="senha" name="senha" minlength="8" maxlength="12" required>
       </div>
          
    </fieldset>
    
    <button type="submit">Enviar Cadastro</button>

  </form>

  <script src="script.js"></script>
  
</body>
</html>
